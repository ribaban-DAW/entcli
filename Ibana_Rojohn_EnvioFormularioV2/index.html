<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>

<body>
  <main>
    <section>
      <form class="form">
        <div class="form__container form__container--nombre">
          <label class="form__label" for="nombre">Nombre</label>
          <input class="form__input" type="text" id="nombre" name="nombre" placeholder="Nombre" required>
          <div class="form__error form__error--nombre"></div>
        </div>

        <div class="form__container form__container--apellidos">
          <label class="form__label" for="apellidos">Apellidos</label>
          <input class="form__input" type="text" id="apellidos" name="apellidos" placeholder="Apellidos" required>
          <div class="form__error form__error--apellidos"></div>
        </div>

        <div class="form__container form__container--edad">
          <label class="form__label" for="edad">Edad</label>
          <input class="form__input" type="number" id="edad" name="edad" placeholder="22" required>
          <div class="form__error form__error--edad"></div>
        </div>

        <div class="form__container form__container--email">
          <label class="form__label" for="email">Correo Electrónico</label>
          <input class="form__input" type="email" id="email" name="email" placeholder="tu@correo.com" required>
          <div class="form__error form__error--email"></div>
        </div>

        <div class="form__container form__container--telefono">
          <label class="form__label" for="telefono">Teléfono</label>
          <input class="form__input" type="tel" id="telefono" name="telefono" placeholder="123123123" required>
          <div class="form__error form__error--telefono"></div>
        </div>

        <button class="form__button" type="submit">Enviar</button>
        <div class="form__status"></div>
      </form>
    </section>
    <section class="container"></section>
  </main>
</body>

</html>
